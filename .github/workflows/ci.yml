name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    name: Brain (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # REQUIRED: correctness + security rules (syntax errors, undefined names, bandit rules).
      - name: Lint (required rules)
        run: ruff check app --select E9,F63,F7,F82,S --ignore S101

      - name: Tests + coverage gate
        run: >
          pytest -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-coverage
          path: brain/coverage.xml
          if-no-files-found: ignore

  brain-strict:
    name: Brain strict lint + types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (full rule set)
        run: ruff check app tests
      - name: Mypy (strict)
        run: mypy --explicit-package-bases app

  mcp-client:
    name: MCP client (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp-client/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (production deps, high severity)
        run: npm audit --omit=dev --audit-level=high
