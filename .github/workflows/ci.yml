name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain:
    name: Brain (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install (from lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      # REQUIRED: correctness + security rules (syntax errors, undefined names, bandit rules).
      - name: Lint (required rules)
        run: ruff check app --select E9,F63,F7,F82,S --ignore S101

      - name: Tests + coverage gate
        run: >
          pytest -q
          --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-coverage
          path: brain/coverage.xml
          if-no-files-found: ignore

  brain-strict:
    name: Brain strict lint + types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt
      - name: Install (from lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Ruff (full rule set)
        run: ruff check app tests
      - name: Mypy (strict)
        run: mypy --explicit-package-bases app

  mcp-client:
    name: MCP client (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/mcp-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp-client/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (production deps, high severity)
        run: npm audit --omit=dev --audit-level=high

  kind-cluster:
    name: Real cluster proof (Kind Gate G0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install dependencies (from lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r brain/requirements.txt
          pip install --no-deps -e brain

      - name: Create kind cluster
        run: |
          if ! command -v kind &> /dev/null; then
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          fi
          kind create cluster --config lab/kind-config.yaml --wait 120s

      - name: Deploy lab manifests
        run: |
          kubectl apply -f lab/manifests/
          kubectl rollout status deployment/payment-gateway -n payments --timeout=120s
          kubectl get all -n payments

      - name: Run real cluster test suite (T-01, T-02, T-04)
        run: |
          pytest -v -s lab/test_real_cluster.py --tb=short 2>&1 | tee test_results.txt || (
            echo "### Real Cluster Test Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Cluster Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            kubectl get pods,rs,deploy -n payments -o wide >> $GITHUB_STEP_SUMMARY
            kubectl describe deployment payment-gateway -n payments >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          )

      - name: Run end-to-end real cluster demo
        run: |
          python lab/run_real_cluster_demo.py

